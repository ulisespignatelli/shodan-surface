name: Actualizar superficie y publicar

on:
  schedule:
    - cron: "0 */12 * * *"      # cada 12 horas (cuidá tus créditos de Shodan)
  workflow_dispatch:            # permite correrlo a mano
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false     # no cortar una publicación a la mitad

jobs:
  # 1) Compila: consulta Shodan, genera el JSON y sube el sitio como artefacto.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar Shodan y generar el JSON
        env:
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
        run: |
          # Si el secret no está configurado, collect.py genera datos de ejemplo.
          python3 collect.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # 2) Publica: en un job aparte, cuando el artefacto ya quedó registrado.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
